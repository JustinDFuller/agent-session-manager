name: Format

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-format:
    name: swift-format check
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v7

      - name: Check supported Swift toolchain
        run: bash scripts/check-toolchain.sh swift-only

      - name: Check formatting
        run: swift format lint --recursive --strict Sources/ Tests/ UITests/
