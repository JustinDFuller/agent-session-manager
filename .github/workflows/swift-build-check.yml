name: Swift Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    name: swift package resolve
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v7

      - name: Check supported Swift toolchain
        run: bash scripts/check-toolchain.sh swift-only

      - name: Resolve packages
        run: swift package resolve
