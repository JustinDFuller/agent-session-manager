name: OpenSpec

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]

permissions: {}

jobs:
  openspec-check:
    name: openspec-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout base-branch enforcement source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.repository.default_branch }}
          path: enforcement-source
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"

      - name: Test base-owned validator
        run: node --test enforcement-source/.github/scripts/openspec-merge-gate.test.mjs

      - name: Checkout immutable pull request candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          path: candidate
          persist-credentials: false

      - name: Checkout immutable stack trunk snapshot
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.stack.base.sha || github.event.pull_request.base.sha }}
          path: stack-trunk
          persist-credentials: false

      - name: Checkout immutable immediate-base snapshot
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha }}
          path: immediate-base
          persist-credentials: false

      - name: Validate pull request OpenSpec state
        if: github.event_name == 'pull_request_target'
        env:
          EVENT_NAME: pull_request_target
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
          STACK_PRESENT: ${{ github.event.pull_request.stack != null && 'true' || 'false' }}
          STACK_BASE_REF: ${{ github.event.pull_request.stack.base.ref || '' }}
          STACK_BASE_SHA: ${{ github.event.pull_request.stack.base.sha || '' }}
          STACK_POSITION: ${{ github.event.pull_request.stack.position || '' }}
          STACK_SIZE: ${{ github.event.pull_request.stack.size || '' }}
          TRUNK_DIRECTORY: ${{ github.workspace }}/stack-trunk
          IMMEDIATE_BASE_DIRECTORY: ${{ github.workspace }}/immediate-base
        run: |
          set -euo pipefail
          cp enforcement-source/.github/scripts/openspec-merge-gate.mjs "$RUNNER_TEMP/openspec-merge-gate.mjs"
          node "$RUNNER_TEMP/openspec-merge-gate.mjs" --candidate "$GITHUB_WORKSPACE/candidate"

      - name: Validate OpenSpec state on main
        if: github.event_name == 'push'
        env:
          EVENT_NAME: push
        run: |
          set -euo pipefail
          cp enforcement-source/.github/scripts/openspec-merge-gate.mjs "$RUNNER_TEMP/openspec-merge-gate.mjs"
          node "$RUNNER_TEMP/openspec-merge-gate.mjs" --candidate "$GITHUB_WORKSPACE/candidate"

  openspec-label:
    name: openspec-label
    if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Apply openspec label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          retries: 3
          script: |
            const { owner, repo } = context.repo
            const pull_number = context.payload.pull_request.number

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number,
            })

            const touchesOpenspec = files.some(f => f.filename.startsWith('openspec/'))
            if (!touchesOpenspec) return

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: pull_number,
              labels: ['openspec'],
            })
