name: AgentSessionManager
options:
  bundleIdPrefix: com.justinfuller
  deploymentTarget:
    macOS: "26.0"
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release
  Dev: release

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    from: 1.18.0
  opentelemetry-swift:
    url: https://github.com/open-telemetry/opentelemetry-swift
    from: 1.9.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.4
  swift-sdk:
    url: https://github.com/modelcontextprotocol/swift-sdk.git
    exactVersion: 0.12.1
  swift-nio:
    url: https://github.com/apple/swift-nio.git
    from: 2.65.0
  swift-log:
    url: https://github.com/apple/swift-log.git
    from: 1.6.0
  swift-system:
    url: https://github.com/apple/swift-system.git
    from: 1.2.0

targets:
  AgentSessionManager:
    type: application
    platform: macOS
    sources:
      - Sources/AgentSessionManager
      - path: AppIcons/Assets.xcassets
        type: folder
    info:
      path: Info.plist
      properties:
        LSMinimumSystemVersion: "26.0"
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        ENABLE_HARDENED_RUNTIME: YES
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lsqlite3"
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.justinfuller.agent-session-manager.xcode-debug
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.justinfuller.agent-session-manager.xcode-release
        Dev:
          PRODUCT_BUNDLE_IDENTIFIER: com.justinfuller.agent-session-manager.xcode-dev
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEV_BUILD
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Dev
    dependencies:
      - target: AgentSessionManagerMCPBridgeCore
      - target: AgentSessionManagerMCPBridge
      - package: SwiftTerm
        product: SwiftTerm
      - package: opentelemetry-swift
        product: OpenTelemetryApi
      - package: opentelemetry-swift
        product: OpenTelemetrySdk
      - package: opentelemetry-swift
        product: StdoutExporter
      - package: opentelemetry-swift
        product: SignPostIntegration
      - package: opentelemetry-swift
        product: ResourceExtension
      - package: Sparkle
        product: Sparkle
      - package: swift-sdk
        product: MCP
      - package: swift-nio
        product: NIOCore
      - package: swift-nio
        product: NIOPosix
      - package: swift-nio
        product: NIOHTTP1
    entitlements:
      path: AgentSessionManager.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.automation.apple-events: true
    postBuildScripts:
      - name: Embed Agent Control MCP Bridge
        script: |
          set -euo pipefail
          helpers_dir="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          mkdir -p "$helpers_dir"
          cp "$BUILT_PRODUCTS_DIR/AgentSessionManagerMCPBridge" "$helpers_dir/"
          codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" "$helpers_dir/AgentSessionManagerMCPBridge"
        inputFiles:
          - "$(BUILT_PRODUCTS_DIR)/AgentSessionManagerMCPBridge"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/AgentSessionManagerMCPBridge"

  AgentSessionManagerMCPBridgeCore:
    type: library.static
    platform: macOS
    sources:
      - Sources/AgentSessionManagerMCPBridgeCore
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
    dependencies:
      - package: swift-sdk
        product: MCP
      - package: swift-log
        product: Logging
      - package: swift-system
        product: SystemPackage

  AgentSessionManagerMCPBridge:
    type: tool
    platform: macOS
    sources:
      - Sources/AgentSessionManagerMCPBridge
    settings:
      base:
        PRODUCT_NAME: AgentSessionManagerMCPBridge
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
    dependencies:
      - target: AgentSessionManagerMCPBridgeCore
      - package: swift-sdk
        product: MCP
      - package: swift-log
        product: Logging
      - package: swift-system
        product: SystemPackage

  AgentSessionManagerUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justinfuller.agent-session-manager.uitests
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: ""
        BUNDLE_LOADER: ""
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.justinfuller.agent-session-manager.uitests
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.justinfuller.agent-session-manager.uitests
        Dev:
          PRODUCT_BUNDLE_IDENTIFIER: com.justinfuller.agent-session-manager.dev.uitests
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEV_BUILD
    entitlements:
      path: AgentSessionManagerUITests.entitlements
      properties:
        com.apple.security.app-sandbox: false
    dependencies:
      - target: AgentSessionManager
        embed: false
